// ================================================================================================
//  R A _ S U B M A P S . C F G
//
//  Makes several votable Rocket Arena maps share one physical BSP.
//
//  Map records define public virtual names and their shared physical BSP:
//      map    virtual_map_name    physical_bsp_name
//
//  Spawn records dynamically create RA starts without requiring a maps/*.ent file:
//      spawn  virtual_map_name    x    y    z    yaw
//
//  Put map records before their spawn records. Define at least two distinct spawn
//  coordinates for every arena so two players never occupy the same origin.
//
//  Add each virtual name to the Rocket Arena sections of warp.cfg and levels.cfg.
//  Ordinary maps and RA maps not listed here retain their existing spawn behavior.
// ================================================================================================

// Alkaline: Makkon's four arenas share maps/lim_makkon.bsp
map  lim_desolate    lim_makkon
map  lim_monumental  lim_makkon
map  lim_eerie       lim_makkon
map  lim_foreboding  lim_makkon

// Initial positions supplied for lim_makkon. Add a second safe spawn for each
// arena before running a two-player match.
spawn  lim_desolate    -1280  -2461  -1739  90
spawn  lim_desolate    -1158  -3048  -1776  90
spawn  lim_monumental   3192  -2827    920  90
spawn  lim_monumental   2546  -3071    920  90
spawn  lim_eerie        2722    454   -232  90
spawn  lim_eerie        3046    763   -232  90
spawn  lim_foreboding    379  -1293   2584  90
spawn  lim_foreboding    146  -1730   2584  90


